<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="facpBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="facpShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Sala eléctrica / Piso 1 -->
  <rect width="400" height="300" fill="#f1f5f9"/>
  <!-- Tuberías superiores de acometida troncal -->
  <rect x="80" y="0" width="16" height="35" fill="#94a3b8" stroke="#475569"/>
  <rect x="120" y="0" width="16" height="35" fill="#94a3b8" stroke="#475569"/>
  <rect x="260" y="0" width="16" height="35" fill="#94a3b8" stroke="#475569"/>
  <rect x="300" y="0" width="16" height="35" fill="#94a3b8" stroke="#475569"/>
  <!-- Gabinete principal FACP -->
  <rect x="60" y="35" width="280" height="235" rx="12" fill="url(#facpBody)" stroke="#450a0a" stroke-width="3" filter="url(#facpShadow)"/>
  <!-- Pantalla LCD anunciadora -->
  <rect x="85" y="55" width="140" height="60" rx="4" fill="url(#screenGrad)" stroke="#075985" stroke-width="2"/>
  <text x="95" y="75" font-family="monospace" font-size="9" fill="#e0f2fe" font-weight="bold">SISTEMA NORMAL - 0 ALARMAS</text>
  <text x="95" y="90" font-family="monospace" font-size="9" fill="#bae6fd">TORRE 33 PISOS - 90.4% OK</text>
  <text x="95" y="105" font-family="monospace" font-size="8" fill="#7dd3fc">SLC1..SLC4 ACTIVOS / 24VDC</text>
  <!-- LEDs indicadores de estado de la central -->
  <circle cx="250" cy="65" r="5" fill="#10b981"/>
  <text x="262" y="68" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">POWER</text>
  <circle cx="250" cy="80" r="5" fill="#ef4444" opacity="0.3"/>
  <text x="262" y="83" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">ALARM</text>
  <circle cx="250" cy="95" r="5" fill="#f59e0b" opacity="0.3"/>
  <text x="262" y="98" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">SUPERVISORY</text>
  <circle cx="250" cy="110" r="5" fill="#f59e0b" opacity="0.3"/>
  <text x="262" y="113" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">TROUBLE</text>
  <!-- Teclado de control / pulsadores -->
  <rect x="85" y="125" width="230" height="40" rx="4" fill="#1e293b"/>
  <rect x="95" y="133" width="30" height="22" rx="3" fill="#334155"/>
  <text x="110" y="148" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">ACK</text>
  <rect x="135" y="133" width="35" height="22" rx="3" fill="#334155"/>
  <text x="152" y="148" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">SILENCE</text>
  <rect x="180" y="133" width="30" height="22" rx="3" fill="#dc2626"/>
  <text x="195" y="148" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">RESET</text>
  <rect x="220" y="133" width="30" height="22" rx="3" fill="#334155"/>
  <text x="235" y="148" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">DRILL</text>
  <!-- Compartimiento de baterías de respaldo 2x12V 18Ah -->
  <rect x="85" y="180" width="105" height="75" rx="4" fill="#0f172a"/>
  <text x="137" y="222" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">BATERÍAS 24V</text>
  <!-- Módulos de lazo y fuentes secundarias -->
  <rect x="200" y="180" width="115" height="75" rx="4" fill="#0f172a"/>
  <text x="257" y="222" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">LAZOS SLC / FUENTE</text>
  <!-- Tag de estado -->
  <rect x="90" y="275" width="220" height="22" rx="4" fill="#10b981"/>
  <text x="200" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CEREBRO PISO 1 EN SERVICIO</text>
</svg>
