<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="shadowStrobe" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#f8fafc"/>
  <!-- Tubo EMT superior -->
  <rect x="193" y="0" width="14" height="40" fill="#94a3b8" stroke="#475569"/>
  <!-- Base de sirena / carcasa blanca o roja -->
  <rect x="140" y="45" width="120" height="175" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="url(#shadowStrobe)"/>
  <!-- Lente estroboscópico de xenón / LED superior -->
  <rect x="150" y="55" width="100" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Rayos reflectores -->
  <path d="M 160 85 L 175 70 M 175 85 L 190 70 M 210 70 L 225 85 M 225 70 L 240 85" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bombilla estrobo centelleante -->
  <ellipse cx="200" cy="85" rx="16" ry="10" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
  <circle cx="200" cy="85" r="5" fill="#facc15"/>
  <!-- Texto FIRE -->
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="1">FIRE</text>
  <!-- Rejilla de bocina / sirena acústica (Horn) -->
  <rect x="155" y="160" width="90" height="45" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="165" y1="170" x2="235" y2="170" stroke="#64748b" stroke-width="2.5"/>
  <line x1="165" y1="180" x2="235" y2="180" stroke="#64748b" stroke-width="2.5"/>
  <line x1="165" y1="190" x2="235" y2="190" stroke="#64748b" stroke-width="2.5"/>
  <!-- Tag de inspección -->
  <rect x="100" y="240" width="200" height="32" rx="6" fill="#10b981"/>
  <text x="200" y="261" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SIRENA-STROBE PROBADA OK</text>
</svg>
