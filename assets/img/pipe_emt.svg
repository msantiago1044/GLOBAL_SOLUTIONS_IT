<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wallBg)"/>
  <!-- Trazado de losa / cielo raso -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 5"/>
  <!-- Soporte / Unistrut -->
  <rect x="70" y="40" width="20" height="90" fill="#64748b"/>
  <rect x="310" y="40" width="20" height="90" fill="#64748b"/>
  <!-- Tubería EMT Conduit metálica roja de incendio -->
  <rect x="0" y="115" width="400" height="30" fill="url(#pipeGrad)" stroke="#64748b" stroke-width="2"/>
  <!-- Anillos de unión / Coplas EMT -->
  <rect x="90" y="112" width="25" height="36" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <rect x="285" y="112" width="25" height="36" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <!-- Caja de paso tipo FS / Cuadrada 4x4 roja -->
  <rect x="160" y="90" width="80" height="80" rx="8" fill="url(#boxGrad)" stroke="#7f1d1d" stroke-width="3"/>
  <circle cx="200" cy="130" r="16" fill="#fecaca" opacity="0.6"/>
  <circle cx="170" cy="100" r="4" fill="#ffffff"/>
  <circle cx="230" cy="100" r="4" fill="#ffffff"/>
  <circle cx="170" cy="160" r="4" fill="#ffffff"/>
  <circle cx="230" cy="160" r="4" fill="#ffffff"/>
  <text x="200" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FIRE</text>
  <!-- Abrazaderas tipo gota o soporte Caddy -->
  <rect x="72" y="110" width="16" height="40" rx="3" fill="#334155"/>
  <rect x="312" y="110" width="16" height="40" rx="3" fill="#334155"/>
  <!-- Tag de inspección -->
  <rect x="110" y="220" width="180" height="32" rx="6" fill="#10b981"/>
  <text x="200" y="241" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TUB-EMT-3/4" INSTALADA OK</text>
</svg>
