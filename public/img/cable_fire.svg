<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="wireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wireBg)"/>
  <!-- Bandeja portacable o ducto perimetral -->
  <rect x="30" y="50" width="340" height="200" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="30" y1="90" x2="370" y2="90" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="30" y1="130" x2="370" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="30" y1="170" x2="370" y2="170" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="30" y1="210" x2="370" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Rutas de cable FPLR 2x16 AWG certificado -->
  <path d="M 10 95 C 100 85, 200 110, 390 100" fill="none" stroke="url(#cableGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 10 135 C 120 145, 240 125, 390 140" fill="none" stroke="url(#cableGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 10 175 C 80 165, 250 185, 390 170" fill="none" stroke="url(#cableGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Cintillos / Abrazaderas plásticas de sujeción (peinado de cable) -->
  <rect x="110" y="80" width="8" height="110" rx="3" fill="#0f172a"/>
  <rect x="230" y="80" width="8" height="110" rx="3" fill="#0f172a"/>
  <rect x="320" y="80" width="8" height="110" rx="3" fill="#0f172a"/>
  <!-- Etiqueta de identificación de lazo SLC -->
  <rect x="135" y="105" width="80" height="24" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="175" y="122" font-family="monospace" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">SLC-L1-T12</text>
  <!-- Rótulo de cable -->
  <text x="250" y="162" font-family="Arial, sans-serif" font-size="9" fill="#fecaca" letter-spacing="1">FPLR 2x16 AWG SHIELDED 300V</text>
  <!-- Tag de estado -->
  <rect x="100" y="240" width="200" height="32" rx="6" fill="#10b981"/>
  <text x="200" y="261" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CABLEADO CONTINUO OK</text>
</svg>
